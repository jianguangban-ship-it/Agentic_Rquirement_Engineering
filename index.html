<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PMSM Simulator</title>
  <link rel="stylesheet" href="/src/styles/main.css" />
</head>
<body>
  <div id="app">
    <header class="header">
      <h1>PMSM Simulator</h1>
      <nav class="nav-tabs">
        <a href="#/simulation" class="nav-tab" data-view="simulation">Simulation</a>
        <a href="#/parameter-configuration" class="nav-tab" data-view="parameter-configuration">Parameter-Configuration</a>
      </nav>
    </header>

    <div id="view-simulation" class="view">
      <main class="dashboard">
        <section class="chart-grid" id="chart-grid">
          <div class="chart-panel" id="chart-phase-currents">
            <h3>Phase Currents (ia, ib, ic)</h3>
            <div class="chart-container"></div>
          </div>
          <div class="chart-panel" id="chart-dq-currents">
            <h3>d-q Currents (id, iq)</h3>
            <div class="chart-container"></div>
          </div>
          <div class="chart-panel" id="chart-torque">
            <h3>Torque (Te, TL)</h3>
            <div class="chart-container"></div>
          </div>
          <div class="chart-panel" id="chart-speed">
            <h3>Speed &amp; Position</h3>
            <div class="chart-container"></div>
          </div>
          <div class="chart-panel" id="chart-voltages">
            <h3>Voltages (Vd, Vq)</h3>
            <div class="chart-container"></div>
          </div>
          <div class="chart-panel" id="chart-dq-trajectory">
            <h3>d-q Trajectory</h3>
            <div class="chart-container"></div>
          </div>
        </section>
      </main>

      <div class="control-strip" id="control-bar"></div>

      <footer class="status-bar" id="status-bar">
        <span>Status: Idle</span>
      </footer>
    </div>

    <div id="view-parameter-configuration" class="view" hidden>
      <div class="param-config-page">
        <h2 class="page-title">Parameter Configuration</h2>
        <div class="param-panel" id="parameter-panel"></div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
